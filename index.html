<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bena — Private Spaces</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #000000; color: #f5f5f7; }
    .glass-card {
      background: rgba(22, 22, 23, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .apple-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.3s ease;
    }
    .apple-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased relative overflow-x-hidden selection:bg-white/20 selection:text-white">

  <!-- Dynamic Ambient Mouse Glow Background -->
  <div id="mouse-glow" class="pointer-events-none fixed inset-0 z-0 transition-opacity duration-700 opacity-40" style="background: radial-gradient(800px circle at 50% 50%, rgba(120, 119, 198, 0.15), transparent 70%);"></div>

  <!-- ================= AUTH CONTAINER ================= -->
  <div id="auth-container" class="relative z-10 min-h-screen flex items-center justify-center p-6 animate-fade-in">
    <div class="w-full max-w-[420px] glass-card rounded-[28px] p-8 md:p-10 shadow-2xl animate-slide-up">
      
      <!-- Tabs for Sign In & Create Account -->
      <div class="flex p-1 bg-white/5 border border-white/10 rounded-xl mb-6">
        <button id="tab-login" type="button" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-white/10 text-white shadow">
          Sign In
        </button>
        <button id="tab-signup" type="button" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-zinc-400 hover:text-white">
          Create Account
        </button>
      </div>

      <!-- Brand Logo -->
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold tracking-tight text-white mb-1 font-sans">
          Bena
        </h1>
        <p id="auth-subtitle" class="text-zinc-400 text-xs tracking-wide">Sign in to access your private spaces</p>
      </div>

      <!-- Error / Success Messages -->
      <div id="error-msg" class="hidden mb-6 p-3.5 text-xs bg-red-500/10 border border-red-500/20 text-red-300 rounded-xl backdrop-blur-md animate-fade-in"></div>
      <div id="info-msg" class="hidden mb-6 p-3.5 text-xs bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 rounded-xl backdrop-blur-md text-center"></div>
      
      <!-- Auth Form -->
      <form id="auth-form" class="space-y-4">
        <div class="space-y-1">
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider ml-1">Email</label>
          <input type="email" id="email" required placeholder="name@domain.com" class="w-full px-4 py-3.5 apple-input rounded-2xl focus:outline-none text-white text-sm placeholder:text-zinc-600">
        </div>

        <div class="space-y-1">
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider ml-1">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3.5 apple-input rounded-2xl focus:outline-none text-white text-sm placeholder:text-zinc-600">
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold rounded-2xl text-sm transition-all duration-300 transform active:scale-[0.98] shadow-lg mt-2">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ================= DASHBOARD CONTAINER ================= -->
  <div id="dashboard-container" class="hidden relative z-10 min-h-screen flex flex-col animate-fade-in">
    <header class="border-b border-white/10 bg-black/40 backdrop-blur-xl sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-tight text-white">Bena</h1>
        <button id="logout-btn" class="text-xs text-zinc-400 hover:text-white transition px-3 py-1.5 rounded-lg hover:bg-white/5 border border-transparent hover:border-white/10">
          Sign Out
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 flex-1 w-full">
      <div class="mb-10">
        <h2 class="text-2xl font-bold text-white tracking-tight mb-1">Your Spaces</h2>
        <p class="text-zinc-400 text-xs">Manage your secure circles and spaces.</p>
      </div>
      <div id="spaces-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <script>
    const mouseGlow = document.getElementById('mouse-glow');
    window.addEventListener('mousemove', (e) => {
      mouseGlow.style.background = `radial-gradient(800px circle at ${e.clientX}px ${e.clientY}px, rgba(120, 119, 198, 0.12), transparent 70%)`;
    });

    const SUPABASE_URL = 'https://squffpbesprtmzyztzox.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxdWZmcGJlc3BydG16eXp0em94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTY4MjUsImV4cCI6MjEwMjQ3MjgyNX0.It6g0pCGoGF3iOGexN2U48LFmgFYSjlbCazLdmmayf8';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    let isSignUp = false;
    const authForm = document.getElementById('auth-form');
    const authContainer = document.getElementById('auth-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const errorMsg = document.getElementById('error-msg');
    const infoMsg = document.getElementById('info-msg');
    const submitBtn = document.getElementById('submit-btn');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const authSubtitle = document.getElementById('auth-subtitle');

    function setMode(signUpMode) {
      isSignUp = signUpMode;
      errorMsg.classList.add('hidden');
      infoMsg.classList.add('hidden');

      if (isSignUp) {
        tabSignup.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-white/10 text-white shadow';
        tabLogin.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-zinc-400 hover:text-white';
        authSubtitle.textContent = 'Create your account to start';
        submitBtn.textContent = 'Create Account';
      } else {
        tabLogin.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-white/10 text-white shadow';
        tabSignup.className = 'flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-zinc-400 hover:text-white';
        authSubtitle.textContent = 'Sign in to access your private spaces';
        submitBtn.textContent = 'Sign In';
      }
    }

    tabLogin.addEventListener('click', () => setMode(false));
    tabSignup.addEventListener('click', () => setMode(true));

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      infoMsg.classList.add('hidden');
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = isSignUp ? 'Creating account...' : 'Signing in...';

      if (isSignUp) {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.classList.remove('hidden');
        } else {
          infoMsg.textContent = 'Account created successfully! You can now sign in.';
          infoMsg.classList.remove('hidden');
          setMode(false);
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.classList.remove('hidden');
        } else if (data.session) {
          showDashboard();
        }
      }

      submitBtn.disabled = false;
      submitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
    });

    function showDashboard() {
      authContainer.classList.add('hidden');
      dashboardContainer.classList.remove('hidden');
    }

    function showAuth() {
      authContainer.classList.remove('hidden');
      dashboardContainer.classList.add('hidden');
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        showDashboard();
      } else {
        showAuth();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      showAuth();
    });
  </script>
</body>
</html>
