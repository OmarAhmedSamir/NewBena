<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bena - Private Spaces</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { serif: ['Playfair Display', 'serif'] } } } }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

  <div id="mouse-glow" class="pointer-events-none fixed inset-0 z-0 transition-opacity duration-300 opacity-60" style="background: radial-gradient(600px circle at 50% 50%, rgba(245, 158, 11, 0.12), transparent 70%);"></div>

  <!-- Auth Container -->
  <div id="auth-container" class="relative z-10 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-zinc-900/80 border border-zinc-800 rounded-3xl p-8 backdrop-blur-md shadow-2xl">
      <h1 class="font-serif text-4xl font-bold text-center mb-8 bg-gradient-to-r from-white to-zinc-500 bg-clip-text text-transparent">bena</h1>
      <div id="error-msg" class="hidden mb-4 p-3 text-xs bg-red-950/60 border border-red-800 text-red-200 rounded-xl"></div>
      
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Email</label>
          <input type="email" id="email" required class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl focus:outline-none focus:border-amber-400 text-white">
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl focus:outline-none focus:border-amber-400 text-white">
        </div>
        <button type="submit" id="submit-btn" class="w-full py-3.5 bg-zinc-100 text-zinc-950 font-bold rounded-xl hover:bg-white transition">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="dashboard-container" class="hidden relative z-10 min-h-screen p-8">
    <header class="max-w-6xl mx-auto flex justify-between items-center mb-10">
      <h1 class="font-serif text-2xl font-bold text-white">bena</h1>
      <button id="logout-btn" class="text-xs text-zinc-400 hover:text-red-400">Sign Out</button>
    </header>
    <main class="max-w-6xl mx-auto">
      <h2 class="text-2xl font-bold text-white mb-6">Your Spaces</h2>
      <div id="spaces-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://squffpbesprtmzyztzox.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxdWZmcGJlc3BydG16eXp0em94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTY4MjUsImV4cCI6MjEwMjQ3MjgyNX0.It6g0pCGoGF3iOGexN2U48LFmgFYSjlbCazLdmmayf8';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authForm = document.getElementById('auth-form');
    const authContainer = document.getElementById('auth-container');
    const dashboardContainer = document.getElementById('dashboard-container');

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('error-msg').textContent = error.message;
        document.getElementById('error-msg').classList.remove('hidden');
      } else {
        checkSession();
      }
    });

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        authContainer.classList.add('hidden');
        dashboardContainer.classList.remove('hidden');
      } else {
        authContainer.classList.remove('hidden');
        dashboardContainer.classList.add('hidden');
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      checkSession();
    });

    checkSession();
  </script>
</body>
</html>
